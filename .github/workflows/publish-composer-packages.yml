name: Publish Composer packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-composer-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
        run: gh auth setup-git
      - name: Publish package repositories
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          publish() {
            local prefix="$1"
            local repository="$2"
            local remote="https://x-access-token:${GH_TOKEN}@github.com/${repository}.git"
            local split_sha split_tree remote_sha
            local force_main=0

            split_sha="$(git subtree split --prefix="$prefix" "$GITHUB_SHA")"
            split_tree="$(git rev-parse "$split_sha^{tree}")"
            remote_sha="$(git ls-remote "$remote" refs/heads/main | cut -f1)"

            if [[ -n "$remote_sha" ]]; then
              git fetch --no-tags "$remote" refs/heads/main

              if git merge-base --is-ancestor "$remote_sha" "$split_sha"; then
                : # split is a fast-forward of remote main
              elif git diff --quiet "$remote_sha" "$split_sha" -- "$prefix"; then
                # Trees differ in metadata but content under $prefix is identical.
                # This happens whenever the root commit is rewritten (amend, rebase)
                # because git subtree split recomputes commit hashes but keeps
                # the prefix content unchanged. Force-update is safe.
                printf 'Force-updating %s main: prefix content matches (%s -> %s)\n' \
                  "$repository" "$remote_sha" "$split_sha" >&2
                force_main=1
              else
                printf 'Refusing non-fast-forward publish to %s: prefix content differs between %s and %s\n' \
                  "$repository" "$remote_sha" "$split_sha" >&2
                exit 1
              fi
            fi

            if [[ "$force_main" -eq 1 ]]; then
              git push --force "$remote" "$split_sha:refs/heads/main"
            else
              git push "$remote" "$split_sha:refs/heads/main"
            fi

            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              local remote_tag_sha
              remote_tag_sha="$(git ls-remote "$remote" "refs/tags/$GITHUB_REF_NAME" | cut -f1)"

              if [[ -z "$remote_tag_sha" ]]; then
                git push "$remote" "$split_sha:refs/tags/$GITHUB_REF_NAME"
              elif [[ "$remote_tag_sha" != "$split_sha" ]]; then
                if [[ "$force_main" -eq 1 ]]; then
                  local existing_tree
                  existing_tree="$(git rev-parse "$remote_tag_sha^{tree}" 2>/dev/null || echo "")"
                  if [[ "$existing_tree" == "$split_tree" ]]; then
                    git push --force "$remote" "$split_sha:refs/tags/$GITHUB_REF_NAME"
                  else
                    printf 'Refusing to move %s tag %s: tree %s != split tree %s\n' \
                      "$repository" "$GITHUB_REF_NAME" "$existing_tree" "$split_tree" >&2
                    exit 1
                  fi
                else
                  printf 'Refusing to move %s tag %s from %s to %s\n' \
                    "$repository" "$GITHUB_REF_NAME" "$remote_tag_sha" "$split_sha" >&2
                  exit 1
                fi
              fi
            fi
          }

          publish packages/core its-enpii/enpii-studio-core
          publish packages/whatsapp-client its-enpii/enpii-studio-whatsapp-client
