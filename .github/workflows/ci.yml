name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enpii
          POSTGRES_USER: enpii
          POSTGRES_PASSWORD: enpii-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enpii -d enpii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit
      - run: vendor/bin/testbench package:create-sqlite-db
      - run: vendor/bin/testbench vendor:publish --tag=enpii-core-migrations --force
      - run: vendor/bin/testbench vendor:publish --tag=whatsapp-client-config --force
      - run: vendor/bin/testbench list --raw | grep -E '^enpii:whatsapp-(connect|smoke)\b'
      - name: Verify Core migrations on PostgreSQL
        run: |
          vendor/bin/testbench migrate:fresh --force
          vendor/bin/testbench migrate:rollback --force
          vendor/bin/testbench migrate --force
      - run: composer audit --no-interaction
      - run: docker compose config --quiet

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enpii
          POSTGRES_USER: enpii
          POSTGRES_PASSWORD: enpii-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enpii -d enpii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none
      - run: php -r '$pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=enpii", "enpii", "enpii-local"); assert($pdo->query("select 1")->fetchColumn() === 1);'
      - run: php -r '$socket = fsockopen("127.0.0.1", 6379); fwrite($socket, "*1\r\n\x24" . "4\r\nPING\r\n"); assert(str_contains(stream_get_contents($socket), "PONG"));'
      - run: docker compose config --quiet

  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enpii_gateway_test
          POSTGRES_USER: enpii
          POSTGRES_PASSWORD: enpii
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enpii -d enpii_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pdo_sqlite
          coverage: none
      - run: composer install --working-dir=services/whatsapp-gateway --no-interaction
      - run: composer check --working-dir=services/whatsapp-gateway
      - run: DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_DATABASE=enpii_gateway_test DB_USERNAME=enpii DB_PASSWORD=enpii APP_KEY=base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= php services/whatsapp-gateway/artisan migrate:fresh --force
      - run: DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_DATABASE=enpii_gateway_test DB_USERNAME=enpii DB_PASSWORD=enpii APP_KEY=base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= php services/whatsapp-gateway/artisan migrate:rollback --force
      - run: DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_DATABASE=enpii_gateway_test DB_USERNAME=enpii DB_PASSWORD=enpii APP_KEY=base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= php services/whatsapp-gateway/artisan migrate --force
      - run: docker compose config --quiet
      - run: composer audit --working-dir=services/whatsapp-gateway --no-interaction

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run contract:check
      - run: npm run ui:check
      - run: npm run ui:test
      - run: npm run ui:build
      - run: npm run ui:pack
      - run: npm audit --audit-level=high
